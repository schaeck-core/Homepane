# Checks that pull requests still build the firmware; can also be started
# by hand (Actions > Build > Run workflow). Nothing is published. Not on
# pushes: GitHub only gets release states (scripts/publish_github.sh), and
# .github/workflows/release.yml builds those itself. Day-to-day builds run
# on Gitea (.gitea/workflows).

name: Build

on:
  pull_request:
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build the ESP32-C6 co-processor firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          platforms/esp32c6_coprocessor/build.sh

      - name: Build the ESP32-P4 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd platforms/esp32p4
          # reconfigure: the C6 step configured this project before c6fw.bin
          # existed, and the configure step decides whether it is flashed
          idf.py reconfigure build
          test -f build/flash_args && grep -q c6fw.bin build/flash_args || { echo "::error::The C6 image is missing from the P4 build"; exit 1; }
