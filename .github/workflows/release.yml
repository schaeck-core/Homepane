# Publishing a GitHub release (tag vX.Y.Z) builds the firmware and
#   1. signs the OTA manifest (ECDSA P-256) with the secret OTA_SIGNING_KEY;
#      devices only install manifests that match the public key in
#      platforms/esp32p4/main/ota_signing_pubkey.pem,
#   2. attaches the binaries to the release,
#   3. publishes the web flasher and the OTA manifest on GitHub Pages
#      (repository settings: Pages, source "GitHub Actions").
# Pushes without a release only run .github/workflows/build.yml.

name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The release tag is the firmware version: v0.2.0 -> 0.2.0. Devices
      # compare it numerically, dot by dot, with the installed version.
      - name: Version from the tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Release tags look like v1.2.3 (got $GITHUB_REF_NAME)"
            exit 1
          fi
          echo "$VERSION" > platforms/esp32p4/version.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the ESP32-C6 co-processor firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          platforms/esp32c6_coprocessor/build.sh

      - name: Build the ESP32-P4 firmware
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd platforms/esp32p4
          # reconfigure: the C6 step configured this project before c6fw.bin
          # existed, and the configure step decides whether it is flashed
          idf.py reconfigure build
          test -f build/flash_args && grep -q c6fw.bin build/flash_args || { echo "::error::The C6 image is missing from the P4 build"; exit 1; }
          cd build
          python -m esptool --chip esp32p4 merge_bin --output homepane-merged.bin @flash_args

      # Read by the on-device updater (app/cpp/update/UpdateSource.h). Paths
      # are relative to the manifest, so the files work wherever Pages
      # serves them.
      - name: OTA manifest
        shell: bash
        run: |
          cd platforms/esp32p4
          C6_VERSION="$(sed -n 's/^EXPECTED_VERSION="\(.*\)"/\1/p' ../esp32c6_coprocessor/build.sh)-sb.$(tr -d '[:space:]' < ../esp32c6_coprocessor/FW_REVISION)"
          cat > firmware-manifest.json <<EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "min_supported_version": "0.1.0",
            "path": "firmware/homepane.bin",
            "sha256": "$(sha256sum build/lvgl_homeassistant.bin | awk '{print $1}')",
            "coprocessor": {
              "version": "${C6_VERSION}",
              "path": "firmware/c6fw.bin",
              "sha256": "$(sha256sum ../esp32c6_coprocessor/out/c6fw.bin | awk '{print $1}')"
            }
          }
          EOF
          cat firmware-manifest.json

      # The signature covers the exact bytes of firmware-manifest.json: the
      # file is only copied after this step.
      - name: Sign the OTA manifest
        shell: bash
        env:
          OTA_SIGNING_KEY: ${{ secrets.OTA_SIGNING_KEY }}
        run: |
          cd platforms/esp32p4
          if [ -z "$OTA_SIGNING_KEY" ]; then
            echo "::error::The secret OTA_SIGNING_KEY is not set; devices reject unsigned manifests."
            exit 1
          fi
          KEY_FILE="$(mktemp)"
          trap 'rm -f "$KEY_FILE"' EXIT
          printf '%s\n' "$OTA_SIGNING_KEY" > "$KEY_FILE"
          openssl dgst -sha256 -sign "$KEY_FILE" -out firmware-manifest.json.sig firmware-manifest.json
          # a key that does not belong to the embedded public key fails here,
          # before any device sees the result
          openssl dgst -sha256 -verify main/ota_signing_pubkey.pem \
            -signature firmware-manifest.json.sig firmware-manifest.json

      # Web flasher site: the static page, the firmware parts and the ESP Web
      # Tools manifests (with and without the C6 image), generated from
      # build/flash_args so the offsets always match the partition table.
      - name: Web flasher site
        shell: bash
        run: |
          mkdir -p site
          cp tools/web-flasher/index.html tools/web-flasher/style.css site/
          cp platforms/esp32p4/firmware-manifest.json platforms/esp32p4/firmware-manifest.json.sig site/
          python3 tools/web-flasher/make_manifests.py --build-dir platforms/esp32p4/build --out site \
            --version "${{ steps.version.outputs.version }}"
          cp platforms/esp32p4/build/homepane-merged.bin site/firmware/
          find site -type f -exec ls -lh {} \;

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Deploy the web flasher to GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4

      - uses: actions/download-artifact@v4
        with:
          name: github-pages

      # The same files on the release page, for manual flashing
      - name: Attach the firmware to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site && tar -xf artifact.tar -C site
          cd site/firmware
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            homepane-merged.bin homepane.bin bootloader.bin partition-table.bin ota_data_initial.bin c6fw.bin \
            ../firmware-manifest.json ../firmware-manifest.json.sig
