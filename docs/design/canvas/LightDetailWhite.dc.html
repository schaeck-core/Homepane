<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Licht Detail Weiß</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 720px; height: 720px; background: #000000">
<dc-import name="LightDetail" entity="{{ light }}" on-change="{{ change }}" hint-size="720px,720px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { light: { on: true, bri: 65, mode: 'ct', kelvin: 3000, hue: 30, sat: 70, supportsColor: true, label: 'Deckenlicht', room: 'Wohnzimmer' } };
  }
  renderVals() {
    return {
      light: this.state.light,
      change: (p) => this.setState((st) => ({ light: { ...st.light, ...p } }))
    };
  }
}
</script>
</body>
</html>
