<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Mediaplayer Detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.pn button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pn{font-variant-numeric:tabular-nums}
.ov{-webkit-appearance:none;appearance:none;opacity:0;margin:0;cursor:pointer}
</style>
</helmet>
<div class="pn" style="width: 720px; height: 720px; box-sizing: border-box; padding: 16px; background: #000000; color: #ECE9E3; font-family: 'Manrope', system-ui, sans-serif; font-weight: 500; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="height: 72px; display: flex; align-items: center; gap: 16px">
<button aria-label="Zurück" onClick="{{ close }}" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #141413; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 28px; font-weight: 600">Wohnzimmer</span>
<span style="font-size: 18px; color: #A39F97">Music Assistant · {{ stateLabel }}</span>
</div>
</div>

<div style="height: 208px; display: flex; gap: 20px">
<div style="width: 208px; flex: none; border-radius: 24px; background: #1F1E1C; display: flex; align-items: center; justify-content: center; color: #5E5A54"><svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM20 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"></path></svg></div>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 8px 0">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 28px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Titel]</span>
<span style="font-size: 22px; color: #A39F97; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">[Interpret] · [Album]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="height: 6px; border-radius: 3px; background: #1F1E1C"><div style="height: 6px; width: 38%; border-radius: 3px; background: #A39F97"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 18px; color: #8A857D"><span>1:32</span><span>4:05</span></div>
</div>
</div>
</div>

<div style="display: flex; justify-content: center; align-items: center; gap: 24px; height: 112px">
<button aria-label="Zufall" onClick="{{ shuffle }}" style="width: 72px; height: 72px; border-radius: 36px; background: transparent; display: flex; align-items: center; justify-content: center; color: {{ shuffleC }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"></path></svg></button>
<button aria-label="Vorheriger Titel" style="width: 88px; height: 88px; border-radius: 44px; background: #141413; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M18 5l-9 7 9 7zM6 5v14"></path></svg></button>
<button aria-label="{{ playLabel }}" onClick="{{ toggle }}" style="width: 112px; height: 112px; border-radius: 56px; background: #ECE9E3; color: #000000; display: flex; align-items: center; justify-content: center">
<sc-if value="{{ e.playing }}" hint-placeholder-val="{{ true }}"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M8 5v14M16 5v14"></path></svg></sc-if>
<sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}"><svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5l11 7-11 7z"></path></svg></sc-if>
</button>
<button aria-label="Nächster Titel" style="width: 88px; height: 88px; border-radius: 44px; background: #141413; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 5l9 7-9 7zM18 5v14"></path></svg></button>
<button aria-label="Wiederholen" onClick="{{ repeat }}" style="width: 72px; height: 72px; border-radius: 36px; background: transparent; display: flex; align-items: center; justify-content: center; color: {{ repeatC }}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"></path></svg></button>
</div>

<div style="height: 72px; flex: none; border-radius: 24px; position: relative; overflow: hidden; background: #141413">
<div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{ volW }}; background: #2B2A27"></div>
<div style="position: absolute; inset: 0; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; font-size: 22px; pointer-events: none"><span style="display: flex; align-items: center; gap: 12px"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A39F97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4zM17 9a4 4 0 0 1 0 6"></path></svg><label for="vol">Lautstärke</label></span><span style="font-weight: 600">{{ e.vol }}</span></div>
<input id="vol" class="ov" type="range" min="0" max="100" step="1" value="{{ e.vol }}" onChange="{{ setVol }}" style="position: absolute; inset: 0; width: 100%; height: 100%">
</div>

<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 18px; color: #A39F97; padding-left: 4px">Auch abspielen in</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ rooms }}" as="r" hint-placeholder-count="3">
<button onClick="{{ r.pick }}" aria-pressed="{{ r.on }}" style="height: 72px; border-radius: 22px; font-size: 18px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; background: {{ r.bg }}; color: {{ r.fg }}"><span style="width: 10px; height: 10px; border-radius: 5px; background: {{ r.dot }}"></span>{{ r.label }}</button>
</sc-for>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"entity":{"editor":null},"onChange":{"editor":null},"onClose":{"editor":null},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { local: { playing: true, vol: 35, group: ['Küche'], shuffle: false, repeat: false } };
  }
  ent() { return this.props.entity || this.state.local; }
  change(p) {
    if (this.props.onChange) this.props.onChange(p);
    if (!this.props.entity) this.setState((st) => ({ local: { ...st.local, ...p } }));
  }
  renderVals() {
    const e = this.ent();
    const group = e.group || [];
    return {
      e, paused: !e.playing,
      playLabel: e.playing ? 'Pause' : 'Abspielen',
      stateLabel: e.playing ? 'Spielt' : 'Pausiert',
      volW: e.vol + '%',
      shuffleC: e.shuffle ? '#ECE9E3' : '#5E5A54', repeatC: e.repeat ? '#ECE9E3' : '#5E5A54',
      shuffle: () => this.change({ shuffle: !e.shuffle }), repeat: () => this.change({ repeat: !e.repeat }),
      close: () => { if (this.props.onClose) this.props.onClose(); },
      toggle: () => this.change({ playing: !e.playing }),
      setVol: (ev) => this.change({ vol: +ev.target.value }),
      rooms: ['Küche', 'Bad', 'Schlafzimmer'].map((label) => {
        const on = group.indexOf(label) >= 0;
        return { label, on: on ? 'true' : 'false', bg: on ? '#2B2A27' : '#141413', fg: on ? '#ECE9E3' : '#A39F97', dot: on ? '#D6B98A' : '#3A3833', pick: () => this.change({ group: on ? group.filter((g) => g !== label) : group.concat([label]) }) };
      })
    };
  }
}
</script>
</body>
</html>
