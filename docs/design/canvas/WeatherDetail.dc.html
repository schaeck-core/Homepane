<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Wetter Detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&amp;display=swap">
<style>
body{margin:0}
.pn button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.pn{font-variant-numeric:tabular-nums}
</style>
</helmet>
<div class="pn" style="width: 720px; height: 720px; box-sizing: border-box; padding: 16px; background: #000000; color: #ECE9E3; font-family: 'Manrope', system-ui, sans-serif; font-weight: 500; display: flex; flex-direction: column; gap: 16px; overflow: hidden">

<div style="height: 72px; display: flex; align-items: center; gap: 16px">
<button aria-label="Zurück" onClick="{{ close }}" style="width: 64px; height: 64px; flex: none; border-radius: 20px; background: #141413; display: flex; align-items: center; justify-content: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 28px; font-weight: 600">Wetter</span>
<span style="font-size: 18px; color: #A39F97">Zuhause · aktualisiert 12:30</span>
</div>
</div>

<div style="height: 140px; display: flex; align-items: center; gap: 24px; padding: 0 8px">
<svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="#D6B98A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
<span style="font-size: 96px; font-weight: 600; line-height: 1; letter-spacing: -0.04em">16,7°</span>
<span style="margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="font-size: 28px; font-weight: 600">Sonnig</span>
<span style="font-size: 18px; color: #A39F97">Gefühlt 15°</span>
<span style="font-size: 18px; color: #A39F97">Max 22° · Min 13°</span>
</span>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<div style="height: 88px; border-radius: 20px; background: #141413; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 18px; color: #A39F97">Luftfeuchte</span><span style="font-size: 28px; font-weight: 600">77 %</span></div>
<div style="height: 88px; border-radius: 20px; background: #141413; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 18px; color: #A39F97">Wind</span><span style="font-size: 28px; font-weight: 600">12 km/h <span style="font-size: 18px; color: #A39F97">SW</span></span></div>
<div style="height: 88px; border-radius: 20px; background: #141413; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between"><span style="font-size: 18px; color: #A39F97">Regen heute</span><span style="font-size: 28px; font-weight: 600">0 mm</span></div>
</div>

<div style="height: 140px; border-radius: 24px; background: #141413; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); padding: 0 8px">
<sc-for list="{{ hours }}" as="h" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<span style="font-size: 18px; color: #A39F97">{{ h.t }}</span>
<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A39F97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ h.icon }}"></path></svg>
<span style="font-size: 22px; font-weight: 600">{{ h.v }}</span>
</div>
</sc-for>
</div>

<div style="flex: 1; border-radius: 24px; background: #141413; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding: 0 8px">
<sc-for list="{{ days }}" as="d" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px">
<span style="font-size: 18px; color: #A39F97">{{ d.d }}</span>
<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#A39F97" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{ d.icon }}"></path></svg>
<span style="font-size: 22px; font-weight: 600">{{ d.hi }}<span style="color: #8A857D"> {{ d.lo }}</span></span>
<span style="font-size: 18px; color: #94AFC4">{{ d.rain }}</span>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"onClose":{"editor":null},"$preview":{"width":720,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const sun = 'M12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9zM12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4';
    const rain = 'M7 15a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4 4 0 0 1 17 15zM8 18l-1 2M12 18l-1 2M16 18l-1 2';
    const partly = 'M8 20a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4 4 0 0 1 18 20zM9 3v1.5M3.5 8.5H5M5 4.5l1 1M14 6a4 4 0 0 0-7 2.5';
    const cloud = 'M7 18a4 4 0 0 1 0-8 5 5 0 0 1 9.6-1.5A4 4 0 0 1 17 18z';
    return {
      hours: [['13', sun, '18°'], ['14', sun, '20°'], ['15', partly, '21°'], ['16', partly, '22°'], ['17', cloud, '20°'], ['18', cloud, '18°']].map(([t, icon, v]) => ({ t, icon, v })),
      days: [['Mi', sun, '23°', '9°', '0 %'], ['Do', rain, '16°', '9°', '80 %'], ['Fr', rain, '12°', '7°', '90 %'], ['Sa', partly, '15°', '12°', '20 %'], ['So', cloud, '14°', '8°', '30 %']].map(([d, icon, hi, lo, r]) => ({ d, icon, hi, lo, rain: r })),
      close: () => { if (this.props.onClose) this.props.onClose(); }
    };
  }
}
</script>
</body>
</html>
